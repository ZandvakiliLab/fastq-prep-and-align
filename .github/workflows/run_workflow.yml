# .github/workflows/run_workflow.yml
name: RNA-seq Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'workflow/**'
      - 'config/**'
      - 'profiles/**'
      - '.github/workflows/run_workflow.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linting
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: "."
          snakefile: "workflow/Snakefile"
          args: "--lint"

  snakemake:
    # Must match the labels you set in the GARM pool
    runs-on: [self-hosted, linux, jetstream2, snakemake]

    # Optional: cancel in-progress runs on new push to same branch
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Snakemake
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: "."
          snakefile: "workflow/Snakefile"
          install-apptainer: "true"
          args: >-
            --cores all
            --printshellcmds
            --software-deployment-method apptainer conda
            --resources disk_mb=270000 mem_mb=55000 file_lock=1
            --default-resources disk_mb=75000 mem_mb=38000
            --set-resources star_align:mem_mb=38000
            --set-resources star_align:threads=4 
            --default-storage-provider fs
            --default-storage-prefix /mnt/snakemake/${{ github.event.repository.name }}
            --shared-fs-usage software-deployment persistence sources source-cache
            --local-storage-prefix /home/runner/snakemake-scratch
            --rerun-incomplete
            --show-failed-logs
          stagein: "mamba install -n snakemake bioconda::snakemake-storage-plugin-fs"
          show-disk-usage-on-error: true

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install -y gh

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          
      - name: Transfer Results to Container 
        run: | 
          rclone copy /mnt/snakemake/${{ github.event.repository.name }}/results/ jetstream2://zandvakili-cmv-rna-seq/${{ github.event.repository.name }}/results --update
          rclone copy /mnt/snakemake/${{ github.event.repository.name }}/jbrowse/config.json jetstream2://zandvakili-cmv-rna-seq/${{ github.event.repository.name }}/jbrowse/ --update
      
      - name: Clean up Jbrowse Artifacts
        run: |
          rm -rf /mnt/snakemake/${{ github.event.repository.name }}/results/jbrowse/
        
  website:
    name: Create and Publish Website
    runs-on: ubuntu-latest
    needs: snakemake
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JBrowse CLI
        run: npm install -g @jbrowse/cli

      - name: Download latest JBrowse2 web app
        run: |
          jbrowse create webpage/jbrowse
          echo "JBrowse2 version: $(cat webpage/jbrowse/version.txt)"

      - name: Download JBrowse2 config
        run: | 
          mkdir webpage/multiqc
          wget https://js2.jetstream-cloud.org:8001/swift/v1/zandvakili-cmv-rna-seq/${{ github.event.repository.name }}/results/multiqc/multiqc_report.html -O webpage/multiqc/multiqc_report.html
          wget https://js2.jetstream-cloud.org:8001/swift/v1/zandvakili-cmv-rna-seq/${{ github.event.repository.name }}/jbrowse/config.json -O webpage/jbrowse/config.json

      # FIX: .nojekyll must be at the site root, not only inside jbrowse/
      - name: Add .nojekyll to prevent Jekyll processing
        run: |
          touch webpage/jbrowse/.nojekyll

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: webpage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
