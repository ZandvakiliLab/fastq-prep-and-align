# .github/workflows/run_workflow.yml
name: RNA-seq Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'workflow/**'
      - 'config/**'
      - 'profiles/**'
      - '.github/workflows/run_workflow.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Linting
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: "."
          snakefile: "workflow/Snakefile"
          args: "--lint"

  snakemake:
    # Must match the labels you set in the GARM pool
    runs-on: [self-hosted, linux, jetstream2, snakemake]

    # Optional: cancel in-progress runs on new push to same branch
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Snakemake
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: "."
          snakefile: "workflow/Snakefile"
          install-apptainer: "true"
          args: >-
            --cores all
            --printshellcmds
            --software-deployment-method apptainer conda
            --resources disk_mb=270000 mem_mb=55000 file_lock=1
            --default-resources disk_mb=75000 mem_mb=38000
            --set-resources star_align:mem_mb=38000
            --set-resources star_align:threads=4 
            --default-storage-provider fs
            --default-storage-prefix /mnt/snakemake/fastq-prep-and-align
            --shared-fs-usage software-deployment persistence sources source-cache
            --local-storage-prefix /home/runner/snakemake-scratch
            --rerun-incomplete
            --show-failed-logs
            --conda-prefix "/mnt/snakemake/conda"
          stagein: "mamba install -n snakemake bioconda::snakemake-storage-plugin-fs"
          show-disk-usage-on-error: true

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install -y gh

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
          
      - run: rclone copy /mnt/snakemake/fastq-prep-and-align/ jetstream2://zandvakili-cmv-rna-seq/fastq-prep-and-align --update

  quarto:
    name: Quarto
    runs-on: ubuntu-latest
    needs: snakemake
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - run: | 
          rclone copy jetstream2://zandvakili-cmv-rna-seq/fastq-prep-and-align/results/multiqc/multiqc_report.html webpage/multiqc.html
          rclone copy jetstream2://zandvakili-cmv-rna-seq/fastq-prep-and-align/jbrowse/ webpage/jbrowse/

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: webpage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    